aid: tonkean
name: Tonkean
description: >-
  Tonkean is an enterprise AI process-orchestration platform that acts as an
  "AI front door" for internal service teams. Procurement, legal, and IT/HR
  teams use its no-code process builder, proactive AI agents, and 100+
  data-source integrations to orchestrate intake, triage, and fulfillment
  across existing enterprise systems. Tonkean publishes no public developer
  API; data flows in and out through documented inbound/outbound webhook
  connections and no-code custom data sources. Backed by Accel and Lightspeed
  Venture Partners.
